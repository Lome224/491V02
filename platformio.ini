; PlatformIO project config for the Arduino Nano motor controller.
; Firmware sources live in nano/ (flat — no extra src/ subfolder).

[platformio]
src_dir = nano

[env:nano]
platform = atmelavr
board = nanoatmega328new
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_deps =
  pololu/VL53L0X@^1.3.1
build_unflags =
  -std=gnu++11
build_flags =
  -std=gnu++17
